quarkus.log.category."io.quarkiverse.qute.web.image".level=DEBUG
quarkus.http.root-path=/foo/bar
quarkus.qute.template-path-exclude=^\\..*|.*\\/\\..*|.*\\.png$
# the fixtures use example.com urls to show the passthrough: nothing is downloaded (QuteImageRemoteTest turns it on)
quarkus.qute.image.remote.enabled=false

# Custom preset: smaller widths
quarkus.qute.image.presets.small.formats=jpg
quarkus.qute.image.presets.small.widths=320,640
quarkus.qute.image.presets.small.quality=70

# Pixel ratio preset
quarkus.qute.image.presets.retina.formats=jpg
quarkus.qute.image.presets.retina.widths=160,240,320
quarkus.qute.image.presets.retina.pixel-ratio.base-width=160

# Crop preset: square crop from center
quarkus.qute.image.presets.square.formats=jpg
quarkus.qute.image.presets.square.widths=200
quarkus.qute.image.presets.square.crop.ratio=1:1
quarkus.qute.image.presets.square.crop.keep=center

# Direct URL preset: outputs just the URL string
quarkus.qute.image.presets.url-only.formats=jpg
quarkus.qute.image.presets.url-only.widths=640
quarkus.qute.image.presets.url-only.direct-url=true

# Glob pattern: pre-process all PNGs under static/images with the small preset
quarkus.qute.image.generate[0].glob=**/*.png
quarkus.qute.image.generate[0].presets=small

# Banner: same width as retina on a 400px source, with a crop: variants must stay apart per preset
quarkus.qute.image.presets.banner.formats=jpg
quarkus.qute.image.presets.banner.widths=320
quarkus.qute.image.presets.banner.crop.ratio=4:1
quarkus.qute.image.presets.banner.crop.keep=center

# Two formats ImageIO can write: the <picture> branch without libvips
quarkus.qute.image.presets.dual.formats=png,jpg
quarkus.qute.image.presets.dual.widths=320
