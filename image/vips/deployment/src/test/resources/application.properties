quarkus.log.category."io.quarkiverse.qute.web.image".level=DEBUG
quarkus.http.root-path=/foo/bar
quarkus.qute.template-path-exclude=^\\..*|.*\\/\\..*|.*\\.png$

# Custom preset: smaller widths, single format
quarkus.qute.image.presets.small.formats=jpg
quarkus.qute.image.presets.small.widths=320,640

# Crop preset
quarkus.qute.image.presets.square.formats=jpg
quarkus.qute.image.presets.square.widths=200
quarkus.qute.image.presets.square.crop.ratio=1:1
quarkus.qute.image.presets.square.crop.keep=center
