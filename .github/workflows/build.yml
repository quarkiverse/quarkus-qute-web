name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean install -Dno-format

      - name: Build with Maven (Native)
        run: mvn -B install -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip
        # Disable native builds for windows
        if: ${{ !startsWith(matrix.os, 'windows') }}

  build-vips:
    name: Vips tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v4

      - name: Install libvips (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install libvips (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install vips

      - name: Install libvips (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          VIPS_VERSION=$(gh api repos/libvips/build-win64-mxe/releases/latest --jq '.tag_name' | sed 's/^v//')
          ASSET="vips-dev-x64-web-${VIPS_VERSION}.zip"
          gh release download "v${VIPS_VERSION}" --repo libvips/build-win64-mxe --pattern "${ASSET}"
          unzip -q "${ASSET}"
          VIPS_BIN=$(find . -maxdepth 2 -type d -name bin -path "*/vips-dev-*" | head -1)
          echo "Found vips bin dir: ${VIPS_BIN}"
          ls "${VIPS_BIN}"/libvips* || true
          echo "${PWD}/${VIPS_BIN#./}" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: 'maven'

      - name: Build and test vips module
        run: mvn -B clean install -Pvips-tests -Dno-format
